<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyHub — Student Assignment & Grade Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="logo">📘 StudyHub</div>
    <nav>
      <button class="tab-btn active" data-tab="classes">Classes</button>
      <button class="tab-btn" data-tab="assignments">Assignments</button>
      <button class="tab-btn" data-tab="grades">Grades</button>
    </nav>
  </header>

  <main>
    <!-- Overview Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Overall Average</div>
        <div class="stat-value" id="stat-avg">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pending Assignments</div>
        <div class="stat-value" id="stat-pending">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Completed</div>
        <div class="stat-value" id="stat-completed">0</div>
      </div>
    </div>

    <!-- CLASSES TAB -->
    <section id="tab-classes" class="section active">
      <div class="panel">
        <h2>Add a New Class</h2>
        <form id="class-form" class="form-row">
          <div>
            <label for="class-name">Class Name</label>
            <input type="text" id="class-name" placeholder="e.g., AP Biology" required />
          </div>
          <div>
            <label for="class-teacher">Teacher / Section</label>
            <input type="text" id="class-teacher" placeholder="e.g., Mr. Rivera • Period 3" />
          </div>
          <div>
            <label for="class-color">Banner Color</label>
            <select id="class-color">
              <option value="#2563eb">Royal Blue</option>
              <option value="#059669">Emerald Green</option>
              <option value="#7c3aed">Violet</option>
              <option value="#d97706">Amber</option>
              <option value="#dc2626">Crimson</option>
            </select>
          </div>
          <div>
            <button type="submit" class="btn-primary">Add Class</button>
          </div>
        </form>
      </div>

      <div id="class-list" class="class-grid"></div>
    </section>

    <!-- ASSIGNMENTS TAB -->
    <section id="tab-assignments" class="section">
      <div class="panel">
        <h2>New Assignment</h2>
        <form id="assignment-form" class="form-row">
          <div>
            <label for="assign-class">Class</label>
            <select id="assign-class" required></select>
          </div>
          <div>
            <label for="assign-title">Assignment Title</label>
            <input type="text" id="assign-title" placeholder="e.g., Lab Report #4" required />
          </div>
          <div>
            <label for="assign-due">Due Date</label>
            <input type="date" id="assign-due" required />
          </div>
          <div>
            <label for="assign-max">Points Possible</label>
            <input type="number" id="assign-max" value="100" min="1" required />
          </div>
          <div>
            <button type="submit" class="btn-primary">Add Assignment</button>
          </div>
        </form>
      </div>

      <div class="panel">
        <h2>All Assignments</h2>
        <table>
          <thead>
            <tr>
              <th>Status</th>
              <th>Assignment</th>
              <th>Class</th>
              <th>Due Date</th>
              <th>Score</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="assignment-table"></tbody>
        </table>
      </div>
    </section>

    <!-- GRADES TAB -->
    <section id="tab-grades" class="section">
      <div class="panel">
        <h2>Gradebook Summary by Class</h2>
        <table>
          <thead>
            <tr>
              <th>Class</th>
              <th>Teacher</th>
              <th>Graded Items</th>
              <th>Points Earned</th>
              <th>Percentage</th>
              <th>Letter Grade</th>
            </tr>
          </thead>
          <tbody id="gradebook-table"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
